services:
  saga_orchestrator:
    build: .
    container_name: saga_orchestrator 
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    ports:
      - "5123:5123"
    networks:
      - labo05-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - labo05-network

networks:
  labo05-network:
    external: true

volumes:
  mysql_data:
  prometheus_data:
